name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional Play Store signing. Add these repository secrets to sign with
      # your upload key: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the APK is
      # debug-signed, which is fine for sharing with students directly.
      - name: Set up release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VeritasTennis-all-phones.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/VeritasTennis-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/VeritasTennis-older-phones-armv7.apk

      - name: Build Play Store bundle
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab dist/VeritasTennis.aab

      - uses: actions/upload-artifact@v4
        with:
          name: veritas-tennis-android
          path: dist/
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
