<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Live tennis scoring, campus ladder, tournaments and training for Veritas University players.">
  <meta name="theme-color" content="#021E34">

  <!-- Installable on iOS and Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veritas Tennis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Veritas Tennis</title>

  <style>
    html, body { margin: 0; height: 100%; background: #021E34; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 38%, #0D3A5E 0%, #021E34 60%, #010E1A 100%);
      transition: opacity .35s ease; z-index: 10;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    #boot img { width: 132px; height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
    #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #boot .bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #DFAD16;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading Veritas Tennis">
    <img src="icons/Icon-512.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    // Keep the browser's install prompt so the app can offer an "Install" button.
    window.vtInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.vtInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () { window.vtInstallPrompt = null; });
    window.vtPromptInstall = function () {
      var p = window.vtInstallPrompt;
      if (!p) return Promise.resolve(false);
      window.vtInstallPrompt = null;
      return p.prompt().then(function () { return p.userChoice; })
        .then(function (c) { return c && c.outcome === 'accepted'; });
    };

    // Hide the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hide');
      setTimeout(function () { boot.remove(); }, 400);
      // Hand the service worker everything this first visit loaded, so the
      // installed app opens offline straight away.
      if ('serviceWorker' in navigator && performance.getEntriesByType) {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource')
            .map(function (e) { return e.name; })
            .filter(function (u) { return u.indexOf(location.origin) === 0; });
          if (reg.active) reg.active.postMessage({ type: 'precache', urls: urls });
        });
      }
    });

    // Offline support.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
